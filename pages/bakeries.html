<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BeanGo - Bakeries</title>
  <link rel="stylesheet" href="../css/styleshahd.css">
  <link rel="stylesheet" href="../tassnim/styles.css"> <!-- Ensure this is included -->

  <!-- Firebase SDK -->
  <script type="module" src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
  <script type="module" src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore.js"></script>
  <script type="module" src="../js/firebase-config.js"></script>
  <script type="module" src="../js/bakeries.js"></script>

  <style>
    .embed-mode {
      margin: 0 !important;
      padding: 0 !important;
      background: #FFF2EF !important;
    }
    .embed-mode .navbar,
    .embed-mode .page-title {
      display: none !important;
    }
    .embed-mode .product-container,
    .embed-mode .category-selector {
      margin: 0 !important;
      padding: 0 !important;
      background: #FFF2EF !important;
    }
    .embed-mode .product-container,
    .embed-mode .bakery-product-wrapper {
      max-height: none !important;
      overflow: visible !important;
      height: auto !important;
      width: 100% !important;
      display: block !important;
    }
    .embed-mode .bakery-product-wrapper {
      /*cards to the left*/
      margin-left: -35px !important;
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: wrap !important;
      gap: 20px !important;
      justify-content: center !important;
      align-items: stretch !important;
    }
    .embed-mode .bakery-product-wrapper .product-card {
      margin-top: 120px !important;
      flex: 0 1 250px !important;
      max-width: 250px !important;
      min-width: 200px !important;
      box-sizing: border-box !important;
    }
    .embed-mode .nav-arrow.left {
      margin-left: 20px !important;
    }
    .embed-mode .nav-arrow.right {
      margin-right: 20px !important;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo" id="beangoLogo">
      <img src="../images/logo.png" alt="BeanGo">
    </div>
    <div class="nav-links">
      <a href="bakeries.html" class="active">Bakeries</a>
      <a href="drinks.html">Drinks</a>
      <a href="ice-cream.html">Ice Cream</a>
      <a href="/pages/box.html" class="box-link">Box</a>
    </div>
    <div class="points">
      <div class="cart-icon" id="openCart">
        <img src="../images/cart-icon.png" alt="Cart">
      </div>
      <span>10 POINT</span>
    </div>
  </nav>

  <!-- Category Buttons -->
  <div class="category-selector">
    <div class="category-button" data-category="muffins">Muffins</div>
    <div class="category-button" data-category="sheesecake">Sheesecake</div>
    <div class="category-button" data-category="donuts">Donuts</div>
  </div>

  <!-- Page Title -->
  <h1 class="page-title">
    Sweet Treats<br>
    <span>BeanGo's Bakeries</span> Are Here<br>
    to Sweeten Your Day!
  </h1>

  <!-- Product Container -->
  <div class="product-container" id="product-container">
    <div class="nav-arrow-space left"></div>
    <div class="nav-arrow-space right"></div>
    <button class="nav-arrow left">
      <img src="../images/arrow1.png" alt="Previous">
    </button>
    <button class="nav-arrow right">
      <img src="../images/arrow1.png" alt="Next">
    </button>
    <div class="bakery-product-wrapper" id="bakery-product-wrapper">
      <!-- Cards inserted dynamically -->
    </div>
  </div>

  <!-- Product Card Template -->
  <template id="product-card-template">
    <div class="product-card">
      <img src="" alt="" class="product-image">
      <h3 class="product-name"></h3>
      <p class="product-description"></p>
      <div class="price-compose-container">
        <div class="price-container"><div class="price"></div></div>
        <div class="button-container"><button class="compose-now">Compose Now</button></div>
      </div>
    </div>
  </template>

  <!-- Cart Popup Container -->
  <div id="cartContainer"></div>

  <!-- Overlay -->
  <div id="overlay" class="overlay" style="display: none;"></div>

  <!-- Load and activate Cart Popup -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      fetch('../tassnim/cart-popup.html')
        .then(res => res.text())
        .then(data => {
          document.getElementById('cartContainer').innerHTML = data;
          // Load cart logic
          const script = document.createElement('script');
          script.src = '../tassnim/script.js';
          document.body.appendChild(script);
          // Show popup on cart icon click
          const openCartBtn = document.getElementById('openCart');
          openCartBtn?.addEventListener('click', () => {
            if (window.showCartPopup) window.showCartPopup();
          });
          // Attach continueBtn handler
          const continueBtn = document.getElementById('continueBtn');
          if (continueBtn) {
            continueBtn.onclick = function() {
              if (window.hideCartPopup) window.hideCartPopup();
            };
          }
          // Attach backMenuBtn handler
          const backMenuBtn = document.getElementById('backMenuBtn');
          if (backMenuBtn) {
            backMenuBtn.onclick = function() {
              window.location.href = '../pages/index.html';
            };
          }
        });
      // Logo click navigation
      const logo = document.getElementById('beangoLogo');
      if (logo) {
        logo.style.cursor = 'pointer';
        logo.onclick = function() {
          window.location.href = '../pages/home.html';
        };
      }
    });
  </script>
    

  <!-- Category button logic -->
  <script>
    const categoryButtons = document.querySelectorAll('.category-button');
    categoryButtons.forEach(button => {
      button.addEventListener('click', () => {
        categoryButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
      });
    });

    if (window.location.search.includes('embed=true')) {
      document.querySelector('.navbar').style.display = 'none';
      document.body.classList.add('embed-mode');
    }
  </script>

  <script>
  (function() {
    function sendHeight() {
      if (window.parent !== window && window.location.search.includes('embed=true')) {
        window.parent.postMessage({
          type: 'setHeight',
          id: 'bakeries.html',
          height: document.body.scrollHeight
        }, '*');
      }
    }
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);
    // In case of dynamic content
    setInterval(sendHeight, 500);
  })();
  </script>
</body>
</html>
