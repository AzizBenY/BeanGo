<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanGo - Drinks</title>
    <link rel="stylesheet" href="../css/styleshahd.css">
    <!-- Firebase SDK -->
    <script type="module" src="https://www.gstatic.com/firebasejs/9.x.x/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.x.x/firebase-firestore.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <img src="../images/logo.png" alt="BeanGo">
        </div>
        <div class="nav-links">
            <a href="bakeries.html">Bakeries</a>
            <a href="drinks.html" class="active">Drinks</a>
            <a href="ice-cream.html">Ice Cream</a>
            <a href="box.html" class="box-link">Box</a>
        </div>
        <div class="points">
            <span class="cart-icon"><img src="../images/cart-icon.png" alt="Cart"></span>
            <span>10 POINT</span>
        </div>
    </nav>

    <div class="category-selector">
        <div class="category-button" data-category="freshy">Freshy</div>
        <div class="category-button" data-category="coffee">Coffee</div>
        <div class="category-button" data-category="smoothie">Smoothie</div>
    </div>

    <h1 class="page-title">Sweet Treats<br>
    <span>BeanGo's Drinks</span> Are Here<br>
    to Sweeten Your Day!</h1>

    <div class="drinks-product-container" id="product-container">
        <!-- Products will be dynamically inserted here -->
    </div>

    <template id="product-card-template">
        <div class="drinks-product-card">
            <img src="" alt="" class="product-image">
            <h3 class="drinks-product-name"></h3>
            <p class="drinks-product-description"></p>
            
            <div class="size-selector">
                <div class="size-option" data-size="small">
                    <div class="size-circle" data-size="small">
                        <img src="../images/small.png" alt="Small" class="size-icon small-icon">
                    </div>
                    <span class="size-label">Small</span>
                </div>
                <div class="size-option" data-size="medium">
                    <div class="size-circle" data-size="medium">
                        <img src="../images/medium.png" alt="Medium" class="size-icon medium-icon">
                    </div>
                    <span class="size-label">Medium</span>
                </div>
                <div class="size-option" data-size="large">
                    <div class="size-circle" data-size="large">
                        <img src="../images/Large2.png" alt="Large" class="size-icon large-icon">
                    </div>
                    <span class="size-label">Large</span>
                </div>
            </div>
            
            <div class="price-compose-container">
                <div class="price">0</div>
                <span class="currency">dt</span>
                <button class="compose-now">Compose Now</button>
            </div>
        </div>
    </template>

    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/drinks.js"></script>

    <script>
        // Handle category selection
        const categoryButtons = document.querySelectorAll('.category-button');
        categoryButtons.forEach(button => {
            button.addEventListener('click', () => {
                categoryButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
            });
        });

        // Handle drink size selection
        const sizeOptions = document.querySelectorAll('.size-option');
        sizeOptions.forEach(option => {
            option.addEventListener('click', () => {
                sizeOptions.forEach(opt => {
                    opt.classList.remove('active');
                    opt.querySelector('.size-circle').style.backgroundColor = '';
                });
                option.classList.add('active');
                option.querySelector('.size-circle').style.backgroundColor = '#B83556';
            });
        });

        // Prevent clicks bubbling on cards
        const productCards = document.querySelectorAll('.drinks-product-card');
        productCards.forEach(card => {
            card.addEventListener('click', (event) => {
                event.stopPropagation();
            });
        });

        // Add embed mode class
        const isEmbed = new URLSearchParams(window.location.search).get("embed") === "true";
        if (isEmbed) {
            document.body.classList.add("embed-mode");
        }
    </script>
    <script>
        // Apply embed mode styling if ?embed=true is in the URL
        if (window.location.search.includes('embed=true')) {
            document.body.classList.add('embed-mode');
        }
    </script>
    
</body>
</html>
