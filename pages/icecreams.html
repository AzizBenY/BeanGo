<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanG - Ice Cream</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container" style="--background: #5A1428">
        <nav class="top-nav">
            <a href="index.html" class="back-button">← Back</a>
        </nav>
        
        <div class="content-container">
            <h1 class="title">Ice Cream</h1>
            <p class="description">Cool down with our creamy, delicious ice cream flavors made with premium ingredients.</p>
            
            <div class="products-grid">
                <div class="product-card">
                    <img src="img/icecream.png" alt="Vanilla Ice Cream" class="product-image">
                    <h3>Vanilla Supreme</h3>
                    <p>Rich and creamy vanilla ice cream</p>
                    <span class="price">$5.99</span>
                    <button class="order-button">Order Now</button>
                </div>
                <div class="product-card">
                    <img src="img/chocolate-icecream.png" alt="Chocolate Ice Cream" class="product-image">
                    <h3>Chocolate Dream</h3>
                    <p>Decadent chocolate ice cream</p>
                    <span class="price">$6.49</span>
                    <button class="order-button">Order Now</button>
                </div>
                <div class="product-card">
                    <img src="img/strawberry-icecream.png" alt="Strawberry Ice Cream" class="product-image">
                    <h3>Strawberry Delight</h3>
                    <p>Fresh strawberry ice cream</p>
                    <span class="price">$6.49</span>
                    <button class="order-button">Order Now</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
