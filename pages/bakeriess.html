<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanG - Bakeries</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container" style="--background: #EB5282">
        <nav class="top-nav">
            <a href="index.html" class="back-button">← Back</a>
        </nav>
        
        <div class="content-container">
            <h1 class="title">Bakeries</h1>
            <p class="description">Indulge in our freshly baked treats, from fluffy donuts to delicious pastries.</p>
            
            <div class="products-grid">
                <div class="product-card">
                    <img src="img/3donuts.png" alt="Assorted Donuts" class="product-image">
                    <h3>Assorted Donuts</h3>
                    <p>A mix of our signature donuts</p>
                    <span class="price">$12.99</span>
                    <button class="order-button">Order Now</button>
                </div>
                <div class="product-card">
                    <img src="img/croissant.png" alt="Croissant" class="product-image">
                    <h3>Butter Croissant</h3>
                    <p>Flaky and buttery French pastry</p>
                    <span class="price">$3.99</span>
                    <button class="order-button">Order Now</button>
                </div>
                <div class="product-card">
                    <img src="img/muffin.png" alt="Muffin" class="product-image">
                    <h3>Blueberry Muffin</h3>
                    <p>Fresh-baked muffin with real blueberries</p>
                    <span class="price">$4.49</span>
                    <button class="order-button">Order Now</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
