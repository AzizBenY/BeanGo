<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanGo - Ice Cream</title>
    <link rel="stylesheet" href="../css/styleshahd.css">
    <link rel="stylesheet" href="../tassnim/styles.css">
    <style>
        .embed-mode {
            margin: 0 !important;
            padding: 0 !important;
            background: #FFF2EF !important;
        }
        .embed-mode .navbar,
        .embed-mode .page-title {
            display: none !important;
        }
        .embed-mode .product-container,
        .embed-mode .category-selector {
            margin: 0 !important;
            padding: 0 !important;
            background: #FFF2EF !important;
        }
        .embed-mode .product-container,
        .embed-mode .ice-cream-product-wrapper {
            max-height: none !important;
            overflow: visible !important;
            height: auto !important;
            width: 100% !important;
            display: block !important;
        }
        .embed-mode .ice-cream-product-wrapper {
            display: flex !important;
            flex-direction: row !important;
            flex-wrap: wrap !important;
            gap: 22px !important;
            justify-content: center !important;
            align-items: stretch !important;
            margin-left: -11px !important;
        }
        .embed-mode .ice-cream-product-wrapper .ice-cream-product-card {
            margin-top: 100px !important;
            flex: 0 1 250px !important;
            max-width: 250px !important;
            min-width: 200px !important;
            box-sizing: border-box !important;
        }
        .embed-mode .nav-arrow.left {
            margin-left: 40px !important;
        }
        .embed-mode .nav-arrow.right {
            margin-right: -3px !important;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" id="beangoLogo">
            <img src="../images/logo.png" alt="BeanGo">
        </div>
        <div class="nav-links">
            <a href="bakeries.html">Bakeries</a>
            <a href="drinks.html">Drinks</a>
            <a href="ice-cream.html" class="active">Ice Cream</a>
            <a href="/pages/box.html" class="box-link">Box</a>
        </div>
        <div class="points">
            <div class="cart-icon" id="openCart">
                <img src="../images/cart-icon.png" alt="Cart">
            </div>
            <span>10 POINT</span>
        </div>
    </nav>

    <div class="category-selector">
        <div  data-category="gelato"></div>
        <div  data-category="sorbet"></div>
        <div  data-category="sundae"></div>
    </div>

    <h1 class="page-title">Cool Down<br>
    <span>BeanGo's Ice Creams</span> Are Here<br>
    to Sweeten Your Day!</h1>

    <div class="product-container ice-cream-product-container" id="product-container">
        <div class="nav-arrow-space left"></div>
        <div class="nav-arrow-space right"></div>
        <button class="nav-arrow left">
            <img src="../images/arrow1.png" alt="Previous">
        </button>
        <button class="nav-arrow right">
            <img src="../images/arrow1.png" alt="Next">
        </button>
        <div class="ice-cream-product-wrapper" id="ice-cream-product-wrapper">
            <!-- Products will be dynamically inserted here -->
        </div>
    </div>

    <template id="product-card-template">
        <div class="product-card ice-cream-product-card">
            <img src="" alt="" class="product-image">
            <h3 class="product-name ice-cream-product-name"></h3>
            <p class="product-description ice-cream-product-description"></p>
            <div class="size-selector">
                <div class="size-option" data-size="small">
                    <span class="size-icon">Small</span>
                </div>
                <div class="size-option" data-size="medium">
                    <span class="size-icon">Medium</span>
                </div>
                <div class="size-option" data-size="large">
                    <span class="size-icon">Large</span>
                </div>
            </div>
            <div class="price-compose-container">
                <div class="price ice-cream-price"></div>
                <button class="compose-now ice-cream-compose-now">Compose Now</button>
            </div>
        </div>
    </template>

    <!-- Cart Popup Container -->
    <div id="cartContainer"></div>
    <!-- Overlay -->
    <div id="overlay" class="overlay" style="display: none;"></div>

    <!-- Firebase config and main logic -->
    <script type="module" src="../js/firebase-config.js"></script>
    <script type="module" src="../js/ice-cream.js"></script>

    <script>
        const isEmbed = new URLSearchParams(window.location.search).get("embed") === "true";
        if (isEmbed) {
            document.body.classList.add("embed-mode");
            document.querySelector('.navbar').style.display = 'none';
        }
    </script>
    <script>
        // Apply embed mode styling if ?embed=true is in the URL
        if (window.location.search.includes('embed=true')) {
            document.body.classList.add('embed-mode');
        }
    </script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        fetch('../tassnim/cart-popup.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('cartContainer').innerHTML = data;
                // Load cart logic
                const script = document.createElement('script');
                script.src = '../tassnim/script.js';
                document.body.appendChild(script);
                // Show popup on cart icon click
                const openCartBtn = document.getElementById('openCart');
                openCartBtn?.addEventListener('click', () => {
                    if (window.showCartPopup) window.showCartPopup();
                });
                // Attach continueBtn handler
                const continueBtn = document.getElementById('continueBtn');
                if (continueBtn) {
                    continueBtn.onclick = function() {
                        if (window.hideCartPopup) window.hideCartPopup();
                    };
                }
                // Attach backMenuBtn handler
                const backMenuBtn = document.getElementById('backMenuBtn');
                if (backMenuBtn) {
                    backMenuBtn.onclick = function() {
                        window.location.href = '../pages/index.html';
                    };
                }
                // Logo click navigation
                const logo = document.getElementById('beangoLogo');
                if (logo) {
                    logo.style.cursor = 'pointer';
                    logo.onclick = function() {
                        window.location.href = '../pages/home.html';
                    };
                }
            });
    });
    </script>
</body>
</html>
