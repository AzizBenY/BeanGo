<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeanG - Box</title>
    <link rel="stylesheet" href="../css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-container" style="--background: #8B4513">
        <nav class="top-nav">
            <a href="index.html" class="back-button">← Back</a>
        </nav>
        
        <div class="content-container">
            <h1 class="title">Box</h1>
            <p class="description">Perfect combinations of our best products in special gift boxes.</p>
            
            <div class="products-grid">
                <div class="product-card">
                    <img src="img/coffee-box.png" alt="Coffee Lover Box" class="product-image">
                    <h3>Coffee Lover Box</h3>
                    <p>2 drinks + 2 pastries of your choice</p>
                    <span class="price">$19.99</span>
                    <button class="order-button">Order Now</button>
                </div>
                <div class="product-card">
                    <img src="img/sweet-box.png" alt="Sweet Tooth Box" class="product-image">
                    <h3>Sweet Tooth Box</h3>
                    <p>6 donuts + 2 ice cream scoops</p>
                    <span class="price">$24.99</span>
                    <button class="order-button">Order Now</button>
                </div>
                <div class="product-card">
                    <img src="img/party-box.png" alt="Party Box" class="product-image">
                    <h3>Party Box</h3>
                    <p>12 assorted items of your choice</p>
                    <span class="price">$39.99</span>
                    <button class="order-button">Order Now</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
