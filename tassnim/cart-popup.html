<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BeanGo Coffee Cart</title>
  
  <!-- ✅ Use relative path to styles.css -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Navbar -->


  <!-- Overlay -->
  <div id="overlay" class="overlay"></div>

  <!-- ✅ Cart Pop-up -->
  <div class="cart-popup" id="cartPopup">
    <div class="cart-header">
      <h3>Shopping Cart</h3>
      <span id="closeCart" class="close-btn">&times;</span>
    </div>

    <div class="cart-items" id="cartItems">
      <div class="cart-item">
        <div class="image-wrapper">
          <img src="https://via.placeholder.com/60" alt="Product Image"/>
        </div>
        <div class="item-info">
          <p>Espresso</p>
          <p class="price">Rp. 15dt</p>
        </div>
        <div class="quantity-control">
          <button>-</button>
          <span>1</span>
          <button>+</button>
        </div>
        <button class="remove-btn">&times;</button>
      </div>
    </div>

    <p id="emptyMessage" class="empty-message">Your cart is empty ☕</p>

    <div class="order-instruction">
      <label for="instructions">Order Instruction:</label>
      <textarea id="instructions" placeholder="Write your special request here..."></textarea>
    </div>

    <div class="cart-total">
      <p>Total: <strong id="cartTotal">Rp. 0dt</strong></p>
      <button class="order-btn" id="checkoutBtn">Order Now</button>
       <button class="continue-btn" id="continueBtn">Continue Shopping</button>
       <button class="back-menu" id="backMenuBtn">Go Menu</button>
    </div>
  </div>

  <!-- ✅ Use relative path to script.js -->
  <script src="script.js"></script>
</body>
</html>
