<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BeanGo Menu</title>
  <link rel="stylesheet" href="homescreen.css" />
</head>
<body>
  <header>
    <h1 class="logo"><img src="images/BeanGo3.png" alt="BeanGo Logo" /></h1>
    <nav>
      <ul class="main-menu">
        <li>Bakeries</li>
        <li class="active-menu">Drinks</li>
        <li>Ice Cream</li>
        <li>Box</li>
        <li></li>
      </ul>
      <div class="cart">🛒 10 POINT</div>
    </nav>
  </header>

  <div class="sub-tabs">
    <div class="tab" onclick="selectTab('freshy')">Freshy</div>
    <div class="tab" onclick="selectTab('coffee')">Coffee</div>
    <div class="tab" onclick="selectTab('smoothie')">Smoothie</div>
  </div>

  <div class="section-display" id="section-display">
    <!-- Message will show here -->
  </div>

  <script>
    // select tab(coffee/freshy/smothie) section message
    function selectTab(tabName) {
      const tabs = document.querySelectorAll(".tab");
      const display = document.getElementById("section-display");

      tabs.forEach((tab) => {
        tab.classList.remove("active");
      });

      const selectedTab = Array.from(tabs).find(
        (t) => t.textContent.toLowerCase() === tabName
      );

      if (selectedTab) {
        selectedTab.classList.add("active");
      }

      // Show section message
      display.textContent = `You are in the ${tabName.charAt(0).toUpperCase() + tabName.slice(1)} section.`;
    }

    // Handle main menu click
  const menuItems = document.querySelectorAll('.main-menu li');
  menuItems.forEach(item => {
    item.addEventListener('click', () => {
      menuItems.forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });

  // Handle cart click
  const cart = document.querySelector('.cart');
  cart.addEventListener('click', () => {
    cart.classList.toggle('active'); // Toggle red on/off
  });
  </script>
</body>
</html>
